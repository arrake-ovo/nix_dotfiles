# =============================================================================
# AeroSpace 配置 · Colemak 版（已接入 Nix）
# 路径: ~/.config/aerospace/aerospace.toml
#
# 文档: https://nikitabobko.github.io/AeroSpace/guide
# 启动: open -a AeroSpace
# 重载: alt-shift-o 进入 service 后按 r  · 或 aerospace reload-config
# 暂停: aerospace enable off / on
# =============================================================================
#
# ── Colemak 说明 ─────────────────────────────────────────────────────────────
# key-mapping.preset = 'colemak' 后：配置里的字母 = 你在 Colemak 下「会打出的键」
# AeroSpace 会自动映射到正确的物理键位。
#
# 导航不用 HJKL（那是 QWERTY vim），改用 Colemak 右手原位：
#
#              U (上)
#          N   E   I     ←  left / down / right
#
# 即: n=左  e=下  i=右  u=上   （NEIU）
# =============================================================================

after-login-command = []
after-startup-command = [
    'workspace 1',
    'workspace 2',
    'workspace 3',
    'workspace 4',
    'workspace 5',
    'workspace 6',
    'workspace 1',
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# 关键：Colemak 键位映射
[key-mapping]
preset = 'qwerty'

# sketchybar 高度约 36，顶部留空
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.right = 8
outer.top = 5

# =============================================================================
# main · 日常模式
# =============================================================================
[mode.main.binding]

# ── 焦点 NEIU ───────────────────────────────────────────────────────────────
#        U
#    N   E   I
alt-n = 'focus --boundaries-action wrap-around-the-workspace left'
alt-e = 'focus --boundaries-action wrap-around-the-workspace down'
alt-u = 'focus --boundaries-action wrap-around-the-workspace up'
alt-i = 'focus --boundaries-action wrap-around-the-workspace right'

# 方向键兜底（键位无关）
alt-left = 'focus --boundaries-action wrap-around-the-workspace left'
alt-down = 'focus --boundaries-action wrap-around-the-workspace down'
alt-up = 'focus --boundaries-action wrap-around-the-workspace up'
alt-right = 'focus --boundaries-action wrap-around-the-workspace right'

# ── 移动窗口 NEIU ───────────────────────────────────────────────────────────
alt-shift-n = 'move left'
alt-shift-e = 'move down'
alt-shift-u = 'move up'
alt-shift-i = 'move right'

alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

# ── 工作区 1-9 ──────────────────────────────────────────────────────────────
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# 上一个 / 下一个工作区
# （不用 n，n 已用于向左焦点）
alt-p = 'workspace --wrap-around prev'
alt-y = 'workspace --wrap-around next'

# 工作区来回切 · 窗口焦点来回切
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'focus-back-and-forth'

# ── 窗口丢到工作区并跟过去 ──────────────────────────────────────────────────
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# 只丢过去、自己不跟
ctrl-alt-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-shift-6 = 'move-node-to-workspace 6'

# ── 布局 ────────────────────────────────────────────────────────────────────
# tiles 横/竖拆分切换
alt-slash = 'layout tiles horizontal vertical'
# accordion（手风琴/堆叠）横/竖
alt-period = 'layout accordion horizontal vertical'
# 当前窗口 浮动 ↔ 平铺
alt-shift-space = 'layout floating tiling'
# 平衡窗口大小（b = balance；e 已用于向下）
alt-b = 'balance-sizes'

# ── 全屏 / 关闭 ─────────────────────────────────────────────────────────────
# AeroSpace 全屏（推荐，不进 macOS 原生 Space）
alt-t = 'fullscreen'
# macOS 原生全屏（一般少用）
alt-shift-t = 'macos-native-fullscreen'
# 关闭窗口
alt-shift-q = 'close'

# ── 快速缩放 ────────────────────────────────────────────────────────────────
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# ── 合并容器（进阶）─────────────────────────────────────────────────────────
# 与某方向邻居加入同一父容器
ctrl-alt-n = 'join-with left'
ctrl-alt-e = 'join-with down'
ctrl-alt-u = 'join-with up'
ctrl-alt-i = 'join-with right'

# ── 启动 ────────────────────────────────────────────────────────────────────
alt-enter = 'exec-and-forget open -a Ghostty'
alt-shift-enter = 'exec-and-forget open -a Safari'

# ── 模式切换 ────────────────────────────────────────────────────────────────
# r = resize
alt-r = 'mode resize'
# o = operations/service（Colemak 下 semicolon 在 o 旁边，用 o 更顺手）
alt-shift-o = 'mode service'

# =============================================================================
# resize · 调大小（alt-r 进入，esc 回 main）
# =============================================================================
[mode.resize.binding]
# 同样 NEIU
n = 'resize width -50'
e = 'resize height +50'
u = 'resize height -50'
i = 'resize width +50'

shift-n = 'resize width -10'
shift-e = 'resize height +10'
shift-u = 'resize height -10'
shift-i = 'resize width +10'

minus = 'resize smart -50'
equal = 'resize smart +50'
b = 'balance-sizes'

enter = 'mode main'
esc = 'mode main'

# =============================================================================
# service · 维护（alt-shift-o 进入）
# =============================================================================
[mode.service.binding]
# 重载配置
r = ['reload-config', 'mode main']
# 拍平窗口树（布局乱了用）
f = ['flatten-workspace-tree', 'mode main']
# 关掉除当前外所有窗口（危险）
x = ['close-all-windows-but-current', 'mode main']
# 临时开关 tiling
d = ['enable toggle', 'mode main']

esc = 'mode main'
enter = 'mode main'

# =============================================================================
# 窗口规则：对话框 / 面板类默认浮动
# 查 bundle id: aerospace list-apps
# =============================================================================

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.SystemSettings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.west2online.ClashXPro'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.west2online.ClashX'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'
