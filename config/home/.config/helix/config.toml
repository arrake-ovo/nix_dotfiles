theme = "everforest_light"

[editor]
line-number = "relative"
cursorline = true
true-color = true
mouse = true
auto-format = false
bufferline = "multiple"

[editor.statusline]
left = ["mode", "spinner"]
center = ["file-name"]
right = [
  "diagnostics",
  "selections",
  "position",
  "file-encoding",
  "file-line-ending",
  "file-type",
]
separator = "⸽"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-messages = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.whitespace]
render = "all"

[editor.whitespace.characters]
nbsp = "␣"
newline = "⏎"
space = "·"
tab = "⇥"
tabpad = "-"  # Tabs will look like "→···" (depending on tab width)

[editor.indent-guides]
render = true
character = "║" # Some characters that work well: "▏", "╎", "┆", "┊", "⸽"
skip-levels = 1

[editor.soft-wrap]
enable = true


[keys.normal]
space.v = ":config-open"
C-r = ":config-reload"

"=" = ["search_next"]  # 下一个搜索结果并居中
"-" = ["search_prev"]  # 上一个搜索结果并居中
#space.CR = ":nohl"  # <Space><CR> 清除搜索高亮

s.i = ":vsplit"  # 垂直分屏（右）
s.n = ":vsplit"  # 垂直分屏（右，忽略 nosplitright）
s.u = ":hsplit"  # 水平分屏（上）
s.e = ":hsplit"  # 水平分屏（下）

space.i = "jump_view_right"  # 移动到右窗口
space.u = "jump_view_up"     # 移动到上窗口
space.n = "jump_view_left"   # 移动到左窗口
space.e = "jump_view_down"   # 移动到下窗口


n = "move_char_left"   # 左移
u = "move_line_up"     # 上移
e = "move_line_down"   # 下移
i = "move_char_right"  # 右移
U= ["move_line_up", "move_line_up", "move_line_up", "move_line_up", "move_line_up"]
E= ["move_line_down", "move_line_down", "move_line_down", "move_line_down", "move_line_down"]
N = "goto_line_start"
I = "goto_line_end"

t.u = ":new"           # t u：创建新空白缓冲区
t.n = ":buffer-previous"  # t n：切换到上一个缓冲区
t.i = ":buffer-next"      # t i：切换到下一个缓冲区


l = "undo"               # 撤销
";" = "redo"         #撤销的撤销
S = ":write"         # S 键：保存文件
q.a =[":write-all",":buffer-close-all",":quit-all"]
Q = [":write",":buffer-close",":quit"]          # Q 键：退出当前窗口或编辑器
q.b =":quit"
q.w =":buffer-close"


k = "insert_mode"
K = ["goto_line_start", "insert_mode"]


p = ["paste_clipboard_after", "collapse_selection"]
x = ["yank_main_selection_to_clipboard", "delete_selection"]

[keys.normal.d]
d = ["extend_to_line_bounds", "yank_main_selection_to_clipboard", "delete_selection"]
t = ["extend_till_char"]
s = ["surround_delete"]
i = ["select_textobject_inner"]
a = ["select_textobject_around"]
j = ["select_mode", "extend_to_line_bounds", "extend_line_below", "yank_main_selection_to_clipboard", "delete_selection", "normal_mode"]
down = ["select_mode", "extend_to_line_bounds", "extend_line_below", "yank_main_selection_to_clipboard", "delete_selection", "normal_mode"]
k = ["select_mode", "extend_to_line_bounds", "extend_line_above", "yank_main_selection_to_clipboard", "delete_selection", "normal_mode"]
up = ["select_mode", "extend_to_line_bounds", "extend_line_above", "yank_main_selection_to_clipboard", "delete_selection", "normal_mode"]
G = ["select_mode", "extend_to_line_bounds", "goto_last_line", "extend_to_line_bounds", "yank_main_selection_to_clipboard", "delete_selection", "normal_mode"]
w = ["move_next_word_start", "yank_main_selection_to_clipboard", "delete_selection"]
W = ["move_next_long_word_start", "yank_main_selection_to_clipboard", "delete_selection"]
g = { g = ["select_mode", "extend_to_line_bounds", "goto_file_start", "extend_to_line_bounds", "yank_main_selection_to_clipboard", "delete_selection", "normal_mode"] }

