# herdr — AI coding agent 的终端复用器
# 习惯对齐：
#   - Dracula 主题（同 fzf / fzf-tab 配色）
#   - zsh + login shell（homebrew PATH 完整）
#   - Colemak 键盘布局：方向统一用 neui（n=左 e=下 u=上 i=右，同 nvim colemak.lua）
#   - neui 分层：裸键=聚焦 pane，shift=交换 pane，ctrl=切 tab

# 跳过首次引导
onboarding = false

[theme]
# 主题名（内置 dracula，与 fzf 配色一致）
name = "dracula"

[terminal]
# 新 pane 默认 shell
default_shell = "zsh"
# macOS 上 login shell 会跑 path_helper + homebrew + ~/.zprofile 初始化，pane 里 PATH 才完整
# （auto 实测没读 ~/.zprofile，导致缺 .pi/agent/bin、.npm-global/bin 等，故显式 login）
shell_mode = "login"

[keys]
# 前缀键：按下后进入 prefix 模式，下一个键交给 herdr 而非 pane 内程序
prefix = "ctrl+b"

# ===== 全局 =====

# 打开键位帮助（可 / 搜索过滤）
help = "prefix+?"
# 打开设置
settings = "prefix+,"
# 重载 config.toml（大部分设置即时生效）
reload_config = "prefix+shift+r"
# 分离：退出 herdr 界面，pane 里的程序继续在后台运行
detach = "prefix+q"

# ===== workspace（工作区）=====

# 新建 workspace（C = Create；原默认 shift+n 让给 swap_pane_left）
new_workspace = "prefix+shift+c"
# 从选中 workspace 新建 git worktree
new_worktree = "prefix+shift+g"
# 重命名选中的 workspace
rename_workspace = "prefix+shift+w"
# 关闭选中的 workspace
close_workspace = "prefix+shift+d"
# 打开 workspace 选择器（navigate mode）
workspace_picker = "prefix+w"
# 打开会话导航器（跳转任意 session/pane）
goto = "prefix+g"
# navigate mode 里 workspace 选择上移（方向键，不占 neui）
navigate_workspace_up = "up"
# navigate mode 里 workspace 选择下移
navigate_workspace_down = "down"
# 切换到上一个 workspace（alt+上：u=上方向）
previous_workspace = "prefix+alt+u"
# 切换到下一个 workspace（alt+下：e=下方向）
next_workspace = "prefix+alt+e"
# 直接跳到第 1-9 个 workspace（alt+数字）
switch_workspace = "prefix+alt+1..9"

# ===== tab（标签页）=====

# 在当前 workspace 新建 tab（t = tab）
new_tab = "prefix+t"
# 重命名当前 tab
rename_tab = "prefix+shift+t"
# 切换到上一个 tab（ctrl+n：n=左方向=前一个）
previous_tab = "prefix+ctrl+n"
# 切换到下一个 tab（ctrl+i：i=右方向=后一个）
next_tab = "prefix+ctrl+i"
# 跳到第 1-9 个 tab
switch_tab = "prefix+1..9"
# 关闭当前 tab
close_tab = "prefix+shift+x"

# ===== pane 导航（Colemak neui：n=左 e=下 u=上 i=右）=====

# navigate mode 里聚焦左 pane
navigate_pane_left = "n"
# navigate mode 里聚焦下 pane
navigate_pane_down = "e"
# navigate mode 里聚焦上 pane
navigate_pane_up = "u"
# navigate mode 里聚焦右 pane
navigate_pane_right = "i"
# 聚焦左 pane（裸 neui）
focus_pane_left = "prefix+n"
# 聚焦下 pane
focus_pane_down = "prefix+e"
# 聚焦上 pane
focus_pane_up = "prefix+u"
# 聚焦右 pane
focus_pane_right = "prefix+i"
# 循环聚焦下一个 pane
cycle_pane_next = "prefix+tab"
# 循环聚焦上一个 pane
cycle_pane_previous = "prefix+shift+tab"
# 回到上一个聚焦的 pane（跨 tab/workspace，类似 tmux 的 prefix+;）
last_pane = "prefix+;"

# ===== 分屏（类比 nvim：s = split；herdr 仅支持右/下两方向）=====

# 垂直分割（左右并排，新 pane 在右）
split_vertical = "prefix+s"
# 水平分割（上下堆叠，新 pane 在下）
split_horizontal = "prefix+shift+s"

# ===== 交换 pane（大写 NEUI）=====

# 与左 pane 交换位置
swap_pane_left = "prefix+shift+n"
# 与下 pane 交换位置
swap_pane_down = "prefix+shift+e"
# 与上 pane 交换位置
swap_pane_up = "prefix+shift+u"
# 与右 pane 交换位置
swap_pane_right = "prefix+shift+i"

# ===== pane 操作 =====

# 关闭当前 pane
close_pane = "prefix+x"
# 缩放当前 pane（最大化/还原）
zoom = "prefix+z"
# 重命名当前 pane
rename_pane = "prefix+shift+p"
# 进入 resize 模式（resize 方向硬编码 hjkl + 方向键，Colemak 下用方向键）
resize_mode = "prefix+r"

# ===== 其他 =====

# 用 $EDITOR 打开当前 pane 的 scrollback
edit_scrollback = "prefix+ctrl+e"
# 进入 copy mode（键盘选择并复制文本，方向键/hjkl 移动）
copy_mode = "prefix+["
# 折叠/展开 sidebar
toggle_sidebar = "prefix+b"
# 聚焦当前可见的通知目标
open_notification_target = "prefix+o"
# 剪贴板图片粘贴（禁用，避免与 zsh 的 ctrl+v edit-command-line 冲突）
remote_image_paste = ""

# ===== 实验性：IME / 中文输入支持 =====
[experimental]
# prefix 模式期间临时切到 ASCII 输入源，避免 ctrl+b 被中文输入法吞掉
switch_ascii_input_source_in_prefix = true
# agent TUI（pi/claude/codex）隐藏光标时仍暴露光标锚点，让 macOS 候选框跟随
reveal_hidden_cursor_for_cjk_ime = true
# 可选白名单：只在列出的 agent pane 暴露光标，避免 vim normal 等场景多出光标。
# 留空 = 对所有 pane 生效。可选值：pi, claude, codex, gemini, cursor, devin, cline,
# opencode, copilot, kimi, kiro, droid, amp, grok, hermes, kilo, qodercli, qoder, qwen,
# qwen-code, maki
# cjk_ime_agents = ["pi", "claude", "codex"]
