# Squirrel settings
# encoding: utf-8
# 修改自: https://github.com/rime/squirrel/blob/master/data/squirrel.yaml
#
# COMMIT SHA: ea6720a0348a2f047ca0d8d87d82b221ac03be7b

config_version: "2025-04-24"

# 可用选项：last | default | _custom_
# last：上次使用的拉丁字母键盘布局
# default：美国（ABC）键盘布局
# _custom_：键盘布局，例如 'com.apple.keylayout.USExtended' 或简写的 'USExtended'
# keyboard_layout: com.apple.keylayout.Colemak
keyboard_layout: last

# 给打字贼快的家伙们设置的按键持续时间（
chord_duration: 0.1 # seconds

# options: always | never | appropriate
show_notifications_when: appropriate
show_notifications_via_notification_center: true

app_options:
# no_inline: true              # 不使用行內編輯
# ascii_punct: true            # 中文状态输出英文标点(半角) 
# ascii_mode: true             # true默认英文,false默认中文
# vim_mode: true               # 退出VIM插入模式自動切換輸入法狀態
# 获取命令：osascript -e 'id of app "App名"'
  com.apple.Spotlight:
    ascii_mode: true    # 开启默认英文
 # com.microsoft.VSCode:
 #   ascii_mode: true
  com.googlecode.iterm2:
    ascii_mode: true
#  com.mitchellh.ghostty:
#    ascii_mode: true
#    vim_mode: true
  org.vim.MacVim:
    ascii_mode: true
    vim_mode: true



style:
  color_scheme: macos14 # 主题方案  
  color_scheme_dark: catppuccin_macchiato # 指定深色模式时输入法所使用的主题方案
  translucency: true # 背景半透明总开关，不需要关掉即可

  # 是否将选定的候选项作为文本嵌入到输入框中
  inline_candidate: false
  # 是否将候选栏贴附到屏幕边缘来减少跳动
  memorize_size: true
  # 是否允许透明颜色之间的堆叠
  mutual_exclusive: true
  # 启用小箭头来看能否上下翻页
  show_paging: false

  # 以下为鼠须管默认设置
  candidate_list_layout: linear # stacked | linear
  text_orientation: horizontal # horizontal | vertical
  inline_preedit: true # 是否内嵌输入码
  corner_radius: 7
  hilited_corner_radius: 0
  border_height: -2
  border_width: -2
  line_spacing: 5
  spacing: 8
  # 大于 0 则会在高亮的候选项周围绘制阴影
  shadow_size: 0
  # 控制非高亮候选背景大小，相对于高亮
  surrounding_extra_expansion: 0
  # 候选项的格式
  candidate_format: "[label]. [candidate] [comment]"
  # base_offset: 0 # 竖排文字的基线调整
  font_face: "Lucida Grande"
  font_point: 16
  # label_font_face: 'Lucida Grande'
  label_font_point: 12
  # comment_font_face: 'Lucida Grande'
  comment_font_point: 16

