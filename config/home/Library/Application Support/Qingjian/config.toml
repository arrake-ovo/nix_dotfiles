# 青简输入法配置。保存后自动生效。
# 从鼠须管 Rime（colemak_custom_mspy）迁过来。双拼用编译进引擎的 colemak_mspy，
# 不是内置 microsoft（那是标准微软，你好=nihk；本方案你好=nihf）。

[general]
learning_language = "en"
# Rime default.yaml menu.page_size
page_size = 4
# 与 Rime default.yaml 一致：minus 上一页、equal 下一页（+ 是 shift+=，青简翻页认 =）
page_keys = "-="
theme = "system"
# Rime squirrel.yaml candidate_list_layout: linear
layout = "horizontal"
# Rime squirrel.yaml inline_preedit: true
preedit = "both"
english_candidates = true
# Rime ascii_punct reset: 1 → 中文状态默认英文标点
full_width_punctuation = false
english_full_width_punctuation = false
shuangpin = "colemak_mspy"
log_level = "info"
input_log = true

[shortcut]
expression = "v"
question = "u"
translation = "option"
translation_second = "shift+option"
translate_selection = "control+option+t"
delete_candidate = "shift"

[fuzzy]
z_zh = false
c_ch = false
s_sh = false
n_l = false
f_h = false
l_r = false
an_ang = false
en_eng = false
in_ing = false

[apps]
# 对齐 squirrel.yaml app_options 里 ascii_mode 的终端 / 编辑器：英文模式不弹候选
english_candidates_off = [
  "com.apple.Terminal",
  "com.googlecode.iterm2",
  "dev.warp.Warp-Stable",
  "com.mitchellh.ghostty",
  "io.alacritty",
  "net.kovidgoyal.kitty",
  "com.microsoft.VSCode",
  "com.todesktop.230313mzl4w4u92",
  "dev.zed.Zed",
  "com.jetbrains.*",
  "org.vim.MacVim",
  "com.sublimetext.*",
  "com.apple.dt.Xcode",
  "com.neovide.neovide",
]

[dictionaries]
domains = ["idioms"]
disabled = []

[model]
enabled = true

[predict]
enabled = true
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
reasoning_effort = "none"
api_key_env = "QINGJIAN_API_KEY"
timeout_ms = 5000
debounce_ms = 300
lookback = 64
lookahead = 32
slots = 2
sentence = true

[status_bar]
enabled = false

# 自定义短码：敲的是原始字母（不是双拼解码后的拼音）。
